    <meta name="google-site-verification" content="F87XkHAqKmz1QUaLJkqPRF4_wLn5VecPn20mY8oFzLs" />

    <title>GLB – GermanLink Business | Germany–Africa Trade & Technology</title>

    <!-- Open Graph / social sharing -->
    <meta property="og:site_name" content="GLB – GermanLink Business" />
    <meta property="og:title" content="GLB – GermanLink Business | Germany–Africa Trade & Technology" />

      property="og:description"
      content="GLB – GermanLink Business verbindet deutsche Technologien, Produkte und Geschäftsmöglichkeiten mit Zentralafrika."

    <meta name="twitter:title" content="GLB – GermanLink Business" />
    <meta name="twitter:image" content="/glb-og-image.png" />

    <!-- WebSite schema: gibt Google den Namen + das Akronym GLB als alternateName -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GLB – GermanLink Business",
        "alternateName": ["GLB", "GermanLink Business"],
        "url": "https://germanlinkbusiness.de/"
      }
    </script>

    <!-- Organization schema: OHNE "GmbH" bis zur offiziellen Handelsregister-Eintragung -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GermanLink Business",
        "alternateName": "GLB",
        "url": "https://germanlinkbusiness.de/",
        "logo": "https://germanlinkbusiness.de/logo.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Burgwedeler Straße 156D",
          "postalCode": "30916",
          "addressLocality": "Isernhagen",
          "addressCountry": "DE"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
